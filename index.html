<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Aucune requête vers un autre site que celui du widget, hors le script de l'API Grist (validé par la DINUM). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://docs.getgrist.com/grist-plugin-api.js; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Grist Automation Builder</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/modal.css">
  <script src="js/theme.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 data-i18n="app.title"></h1>
    <button id="add-node" type="button" data-i18n-label="add.nodeLabel"><span class="icon icon-plus" aria-hidden="true"></span><span data-i18n="add.node"></span></button>
    <button id="test-workflow" type="button"><span class="icon icon-play" aria-hidden="true"></span><span data-i18n="test.run"></span></button>
    <button id="toggle-active" type="button" class="primary" aria-pressed="false"></button>
    <button id="toggle-logs" type="button" class="icon-only" data-i18n-label="logs.toggle" aria-pressed="false"><span class="icon icon-list" aria-hidden="true"></span></button>
    <button id="open-settings" type="button" class="icon-only" data-i18n-label="settings.open" aria-haspopup="dialog"><span class="icon icon-settings" aria-hidden="true"></span></button>
  </header>

  <p id="open-tab-warning" class="warning" data-i18n="app.openTab" hidden></p>

  <main class="stage">
    <div id="canvas" class="canvas"></div>
    <section id="logs" class="logs" hidden>
      <h2 data-i18n="logs.title"></h2>
      <ul id="log-list" class="log-list"><li data-i18n="logs.waiting"></li></ul>
    </section>
  </main>

  <script src="js/version.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/search-select.js"></script>
  <script src="js/nodes.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
